[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateforge"
version = "0.1.0"
description = "Structural execution-graph feedback for coverage-guided fuzzing (research prototype)"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.optional-dependencies]
test = [
    "flask>=3.1",
    "pytest>=8",
    "elementpath>=5",
    "networkx>=3.4",
]

[tool.setuptools.packages.find]
include = ["stateforge*"]

[tool.setuptools.package-data]
stateforge = ["fixtures/**/*", "py.typed"]
