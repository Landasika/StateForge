[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateforge"
version = "0.1.0"
description = "Structural execution-graph feedback for coverage-guided fuzzing (research prototype)"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Required by the public model, graph and framework extraction APIs.
dependencies = [
    "PyYAML==6.0.2",
    "networkx==3.4.2",
    "pydantic==2.11.7",
]

[project.optional-dependencies]
llm = ["httpx==0.28.1"]
replay = ["httpx==0.28.1"]
web = ["flask==3.1.0", "stateforge[replay]"]
django = ["Django>=4.2,<6"]
test = [
    "pytest==8.3.4",
    "stateforge[web,llm]",
    "elementpath==5.1.4",  # OWASP BenchmarkPython cases
]
dev = [
    "stateforge[test]",
    "matplotlib==3.10.0",  # experiment/plot_campaign.py
]
fuzz = [
    "atheris==3.1.0",      # 驱动侧 fuzz 引擎;无预编译 wheel 时 sdist 编译需 clang
]

[tool.setuptools.packages.find]
include = ["stateforge*"]
exclude = ["stateforge.tests", "stateforge.tests.*"]

[tool.setuptools.package-data]
stateforge = ["fixtures/**/*", "py.typed", "analysis/semantics/cache/*.json", "analysis/semantics/prompts/*.md"]
