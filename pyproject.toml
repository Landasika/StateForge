[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateforge"
version = "0.1.0"
description = "Structural execution-graph feedback for coverage-guided fuzzing (research prototype)"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# 运行时依赖:analyzer 运行代码(idioms.py / openapi_adapter.py)模块级 import yaml。
# 开发机 anaconda 自带 PyYAML,曾掩盖缺声明——fresh-clone 验收暴露,故显式收口。
dependencies = [
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
# P0 基线冻结(2026-10-08):驱动侧依赖全部收口于此,版本=实装验证值。
# ANOTA 解释器侧(anota/, CPython 3.10.13 fork)锁定栈另见
# stateforge/requirements-anota.txt,不属于本表。
test = [
    "pytest==8.3.4",
    "flask==3.1.0",
    "networkx==3.4.2",
    "elementpath==5.1.4",  # OWASP BenchmarkPython 部分用例
    "httpx==0.28.1",       # llm/provider.py 直连 GLM API(HTTP 客户端,无 LLM SDK)
    "pydantic==2.11.7",
]
dev = [
    "stateforge[test]",
    "matplotlib==3.10.0",  # experiment/plot_campaign.py
]
fuzz = [
    "atheris==3.1.0",      # 驱动侧 fuzz 引擎;无预编译 wheel 时 sdist 编译需 clang
]

[tool.setuptools.packages.find]
include = ["stateforge*"]

[tool.setuptools.package-data]
stateforge = ["fixtures/**/*", "py.typed", "llm/cache/*.json"]
